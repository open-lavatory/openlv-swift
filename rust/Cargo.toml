[package]
name = "openlv-swift-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "openlv_swift_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
bridge = { package = "openlv-ffi", git = "https://github.com/open-lavatory/openlv-rs", tag = "v0.2.0", version = "=0.2.0" }
uniffi = { version = "=0.32.2" }

[patch.crates-io]
# Remove when a published nix 0.31 release includes https://github.com/nix-rust/nix/pull/2821.
nix = { git = "https://github.com/nix-rust/nix", rev = "f9ba3ed0698255d93240b07ecbf39ecb05a8a5cd" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
